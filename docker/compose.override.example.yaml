# Copy to docker/compose.override.yaml (git-ignored) and put this machine's addresses in it:
#   docker compose -f docker/compose.yaml -f docker/compose.override.yaml up -d
# Compose appends these to the webchat ports (127.0.0.1:8095 stays).
services:
  webchat:
    ports:
      - "<LAN address>:8095:8095"
      - "<Tailscale address>:8095:8095"
